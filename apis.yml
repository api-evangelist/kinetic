name: Kinetic
description: Kinetic (Kinetic Automation) builds robotics-based automated collision repair for
  modern vehicles equipped with advanced driver-assistance systems (ADAS). The company operates
  robotic repair facilities (Kinetic Hubs), automated imaging for collision damage assessment
  and repair estimates (Kinetic Vision), and AI-powered calibration identification software
  (Kinetic ID) that determines which ADAS sensors need recalibration after a repair. Backed by
  Menlo Ventures and Techstars, Kinetic was surfaced as a portfolio-company lead and added to the
  API Evangelist network. As of this enrichment pass the company publishes a marketing and
  corporate site plus a login-only identity portal (id.kinetic.auto); it exposes no public
  developer program, API documentation, OpenAPI, SDKs, or webhooks surface.
